spring.application.name=globostreaming-test

# Database Configuration - H2 in-memory para testes
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway Configuration - Desabilitado em testes (usar Hibernate ddl-auto)
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cw==
jwt.expiration=3600000

# Redis - Mock/disabled para testes
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ - Desabilitado para testes unitários
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Logging Configuration
logging.level.org.flywaydb=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

