spring.application.name=globostreaming

spring.datasource.url=jdbc:postgresql://localhost:5433/globostreaming
spring.datasource.username=globouser
spring.datasource.password=globopass123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG

jwt.secret=Z2xvYm9zdHJlYW1pbmctc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLTI1Ng==
jwt.expiration=86400000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=globouser
spring.rabbitmq.password=globopass123
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

rabbitmq.payment.exchange=payment.exchange
rabbitmq.payment.queue.processing=payment.processing.queue
rabbitmq.payment.queue.result=payment.result.queue
rabbitmq.payment.queue.dlq=payment.dlq
rabbitmq.payment.routing-key.processing=payment.process
rabbitmq.payment.routing-key.result=payment.result
rabbitmq.payment.routing-key.dlq=payment.failed

