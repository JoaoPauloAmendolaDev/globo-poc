spring.application.name=globostreaming

# Database Configuration (para desenvolvimento local - Docker sobrescreve via env vars)
spring.datasource.url=jdbc:postgresql://localhost:5433/globostreaming
spring.datasource.username=globouser
spring.datasource.password=globopass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# Logging Configuration
logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG

