services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: globostreaming-postgres
    environment:
      - 'POSTGRES_DB=globostreaming'
      - 'POSTGRES_USER=globouser'
      - 'POSTGRES_PASSWORD=globopass123'
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globouser -d globostreaming"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globostreaming-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globostreaming-app
    ports:
      - '8080:8080'
    environment:
      # Database Configuration
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/globostreaming
      - SPRING_DATASOURCE_USERNAME=globouser
      - SPRING_DATASOURCE_PASSWORD=globopass123
      # Flyway Configuration
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_BASELINEONMIGRATE=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/globostreaming
      - SPRING_FLYWAY_USER=globouser
      - SPRING_FLYWAY_PASSWORD=globopass123
      # Logging Configuration
      - LOGGING_LEVEL_ORG_FLYWAYDB=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - globostreaming-network

networks:
  globostreaming-network:
    driver: bridge

volumes:
  postgres-data:
